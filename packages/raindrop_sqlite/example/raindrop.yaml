# Required so the CLI can figure out what dialect u are using.
dialect: sqlite

# Optional schemas path, used to generate migrations.
schemas: lib/schemas

# Optional output path for the generated migrations.
# out: migrations/

# Optional: path to generate a Dart migrations file (relative to config dir).
# If set, `generate` also produces this Dart file alongside .sql files.
dart: lib/database/migrations.dart
