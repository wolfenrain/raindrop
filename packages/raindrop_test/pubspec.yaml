version: 0.1.0
repository: https://github.com/wolfenrain/raindrop/tree/main/packages/raindrop_test
issue_tracker: https://github.com/wolfenrain/raindrop/issues
topics:
  - sql
  - database
  - testing
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  meta: ^1.15.0
  raindrop: ^0.1.0
  test: ^1.25.2
  # 0.7.13 is where `backend.dart` starts to export `Invoker`.
  test_api: ^0.7.13

dev_dependencies:
  raindrop_sqlite: ^0.1.0
  sqlite3: ">=2.4.0 <4.0.0"
