name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  semantic_pull_request:
    permissions:
      pull-requests: read
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      config: cspell.json
      includes: |
        **/*.{dart,md,yaml}
        !.dart_tool/**/*.{dart,yaml}
      modified_files_only: false

  packages:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.find.outputs.matrix }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 💾 Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: 📦 Resolve workspace
        run: dart pub get

      - name: 🔍 Discover packages
        id: find
        run: .github/scripts/discover_packages.sh >> "$GITHUB_OUTPUT"

  build:
    needs: packages
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.packages.outputs.matrix) }}

    env:
      MELOS_PACKAGES: ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 💾 Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: 📦 Resolve workspace
        run: dart pub get

      - name: ✨ Check Formatting
        run: dart run melos run format

      - name: 🕵️ Analyze
        run: dart run melos run analyze

      - name: 🚰 Setup Databases
        uses: ./.github/actions/setup-databases
        with:
          databases: ${{ toJSON(matrix.databases) }}

      - name: 🧪 Unit Tests
        run: dart run melos run test:unit --no-select

      - name: 🔌 Integration Tests
        run: dart run melos run test:integration --no-select

  ci:
    needs:
      - semantic_pull_request
      - spell-check
      - build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: ⛔️ Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
