name: 🚰 Setup Databases
description: Sets up the databases a package needs.

inputs:
  databases:
    description: JSON array of databases to set up (["sqlite:bundled", "postgres:16"]).
    default: "[]"

runs:
  using: composite
  steps:
    - name: 🔍 Parse databases
      id: parse
      shell: bash
      env:
        DATABASES: ${{ inputs.databases }}
      run: |
        jq -r 'map(split(":") | { name: .[0], version: (.[1] // "") })[]
          | "\(.name)=true", "\(.name)-version=\(.version)"' \
          <<< "$DATABASES" >> "$GITHUB_OUTPUT"

    - name: 🗃️ Setup SQLite
      if: steps.parse.outputs.sqlite
      uses: ./.github/actions/setup-sqlite
      with:
        version: ${{ steps.parse.outputs.sqlite-version }}

    - name: 🐘 Setup PostgreSQL
      if: steps.parse.outputs.postgres
      uses: ./.github/actions/setup-postgres
      with:
        version: ${{ steps.parse.outputs.postgres-version }}
